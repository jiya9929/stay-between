    border: 1px solid var(--line);
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(59, 42, 32, 0.08);
    overflow: hidden;
  }
  .place-photo { position: relative; aspect-ratio: 16 / 10; background: var(--soft); }
  .place-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .walk-badge {
    position: absolute; left: 12px; bottom: 12px;
    padding: 4px 12px; border-radius: 999px;
    background: var(--frame); color: #FFF8EE;
    font-size: 16px; font-weight: 700;
  }
  .place-body { padding: 16px; }
  .place-top { display: flex; align-items: center; gap: 12px; }
  .place-name-wrap { flex: 1; min-width: 0; }
  .place-name { font-size: 20px; font-weight: 800; color: var(--frame); line-height: 1.3; letter-spacing: -0.01em; }
  .place-en { font-size: 16px; color: var(--brass); font-weight: 700; letter-spacing: 0.04em; line-height: 1.3; }
  .walk-chip { flex: none; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); font-size: 16px; font-weight: 700; }
  .place-tags { font-size: 16px; color: var(--accent); font-weight: 600; margin-top: 8px; }
  .place-text { font-size: 17px; margin-top: 6px; }
  .place-meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 12px; padding: 12px 14px; background: var(--ivory); border-radius: 12px; }
  .place-meta dt { font-size: 16px; font-weight: 700; color: var(--accent); }
  .place-meta dd { font-size: 16px; }
  .place-btns { display: grid; gap: 8px; margin-top: 14px; }
  .place-btns.two { grid-template-columns: 2fr 1fr; }
  .place-btns .btn { min-height: 48px; padding: 10px 12px; }
  .place-mini .place-text { margin-top: 8px; }
  .place-mini .place-name { font-size: 18px; }

  /* 소제목 */
  .sec { margin: 32px 0 12px; display: flex; gap: 12px; align-items: flex-start; }
  .sec .ico-bubble { background: var(--accent); color: #ffffff; }
  .sec-body { flex: 1; min-width: 0; padding-top: 4px; }
  .sec-title { font-size: 21px; font-weight: 800; line-height: 1.35; color: var(--frame); }
  .sec-sub { font-size: 16px; color: var(--accent); margin-top: 2px; }
  .sec-text { font-size: 17px; margin-top: 6px; white-space: pre-line; }

  /* 항목 목록 */
  .row { display: grid; grid-template-columns: 6em 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: none; padding-top: 0; }
  .card-label + .row { border-top: none; padding-top: 4px; }
  .row:last-child { padding-bottom: 0; }
  .row-label { font-size: 16px; font-weight: 700; color: var(--accent); white-space: pre-line; line-height: 1.5; padding-top: 1px; }
  .row-value { font-size: 17px; white-space: pre-line; }
  @media (max-width: 340px) { .row { grid-template-columns: 1fr; gap: 2px; } }

  /* 접힌 칸 */
  .fold-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; margin: -8px 0; cursor: pointer; list-style: none; }
  .fold-head::-webkit-details-marker { display: none; }
  .fold-head .card-label { margin-bottom: 0; }
  .fold-hint { font-size: 16px; font-weight: 600; color: var(--accent); white-space: nowrap; padding: 6px 12px; border-radius: 999px; background: var(--soft); }
  .fold[open] .fold-head { margin-bottom: 8px; }

  /* 번호 순서 */
  .steps { list-style: none; }
  .step { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: none; padding-top: 2px; }
  .step:last-child { padding-bottom: 0; }
  .step-num {
    flex: 0 0 34px; width: 34px; height: 34px;
    border-radius: 17px;
    background: var(--accent); color: #ffffff;
    font-size: 16px; font-weight: 700; line-height: 34px; text-align: center;
  }
  .step-title { font-size: 17px; font-weight: 700; padding-top: 4px; }
  .step-text { font-size: 17px; color: var(--muted); }

  /* 강조 상자 */
  .note {
    background: var(--soft);
    border-radius: 14px;
    padding: 16px 16px 16px 18px;
    margin-bottom: 14px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .note .ico-bubble { background: #ffffff; }
  .note-body { flex: 1; min-width: 0; padding-top: 3px; }
  .note-title { font-size: 17px; font-weight: 700; color: var(--frame); }
  .note-text { font-size: 17px; margin-top: 4px; white-space: pre-line; }

  /* 사진 */
  .figure { margin-bottom: 14px; }
  .figure img { width: 100%; height: auto; display: block; border-radius: 14px; background: var(--soft); }
  .figure figcaption { font-size: 16px; color: var(--muted); margin-top: 6px; }
  .figure.small { background: var(--soft); border-radius: 14px; padding: 16px; text-align: center; }
  .figure.small img { width: auto; max-width: 100%; max-height: 340px; margin: 0 auto; border-radius: 8px; background: transparent; }
  .gallery { display: grid; gap: 10px; margin-bottom: 14px; }
  .gallery-item img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; border-radius: 14px; background: var(--soft); }
  .gallery-item.contain img { object-fit: contain; padding: 8px; }
  .gallery-item figcaption { font-size: 16px; color: var(--muted); margin-top: 6px; line-height: 1.35; }

  /* 다른 화면으로 가는 목록 */
  .link-list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #ffffff; box-shadow: var(--shadow); margin-bottom: 14px; }
  .link-item {
    display: flex; align-items: center; gap: 14px;
    min-height: 64px;
    padding: 12px 16px;
    color: var(--text);
    text-decoration: none;
  }
  .link-item + .link-item { border-top: 1px solid var(--line); }
  .link-item:active { background: var(--soft); }
  .link-label { flex: 1; font-size: 18px; font-weight: 700; color: var(--frame); }
  .link-sub { font-size: 16px; color: var(--accent); white-space: nowrap; }

  /* 전화 */
  .call { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .card-label + .call { border-top: none; padding-top: 4px; }
  .call:last-child { padding-bottom: 0; }
  .call-title { font-size: 18px; font-weight: 700; }
  .call-note { font-size: 16px; color: var(--muted); grid-column: 1; }
  .call .btn { grid-column: 2; grid-row: 1 / span 2; width: auto; min-width: 96px; }

  /* 버튼 */
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%;
    min-height: 52px;
    padding: 12px 16px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.4;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary { background: var(--accent); color: #ffffff; border: 1px solid var(--accent); }
  .btn-line { background: #ffffff; color: var(--accent); border: 1px solid var(--accent); }
  .btn-plain { display: inline-flex; width: auto; min-height: 48px; padding: 10px 0; background: none; border: none; color: var(--accent); }
  .btn:active { opacity: 0.85; }
  .bottom-back { margin-top: 28px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 화면이 바뀔 때 살짝 떠오르기 */
  @media (prefers-reduced-motion: no-preference) {
    .sheet, .body { animation: rise 0.35s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }

  /* 복사 알림 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    max-width: calc(100% - 32px);
    padding: 12px 18px;
    border-radius: 8px;
    background: var(--frame);
    color: #ffffff;
    font-size: 16px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

  function icon(name, cls) {

    return i;

  function showToast(msg) {

    toastBox.classList.add("show");
    clearTimeout(toastTimer);

  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      showToast(ok ? T.copied : T.copyFailed);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { showToast(T.copied); }, fallback);
    } else {
      fallback();
    }
  }

  function mapUrl(type, address) {
    var q = encodeURIComponent(address);
    if (type === "naver") return "https://map.naver.com/p/search/" + q;

    if (type === "google") return "https://www.google.com/maps/search/?api=1&query=" + q;
    return null;
  }

    b.type = "button";

      return d;

    if (label) add(c, el("div", "card-label", label));
    return c;

          img.alt = it.name || "";
          img.loading = "lazy";
          img.onerror = function () { if (ph.parentNode) ph.parentNode.removeChild(ph); };
          img.src = it.photo;
          add(ph, img);
          if (it.walk) add(ph, el("span", "walk-badge", (T.walkLabel ? T.walkLabel + " " : "") + it.walk));
        }
        var body = add(c, el("div", "place-body"));
        var top = add(body, el("div", "place-top"));
        if (!it.photo) addIcon(top, it.icon || "pin", "ico-bubble");
        var nm = add(top, el("div", "place-name-wrap"));
        add(nm, el("h3", "place-name", it.name));
        if (it.en) add(nm, el("div", "place-en", it.en));
        if (!it.photo && it.walk) add(top, el("span", "walk-chip", (T.walkLabel ? T.walkLabel + " " : "") + it.walk));
        if (it.tags) add(body, el("div", "place-tags", it.tags));
        if (it.text) add(body, el("p", "place-text", it.text));
        if (it.menu || it.hours) {
          var meta = add(body, el("dl", "place-meta"));
          if (it.menu) { add(meta, el("dt", "", it.menuLabel || T.placeMenu)); add(meta, el("dd", "", it.menu)); }
          if (it.hours) { add(meta, el("dt", "", it.hoursLabel || T.placeHours)); add(meta, el("dd", "", it.hours)); }
        }
        if (it.map || it.phone) {
          var btns = add(body, el("div", "place-btns" + (it.map && it.phone ? " two" : "")));
          if (it.map) add(btns, linkButton(T.placeMap, "https://map.naver.com/p/search/" + encodeURIComponent(it.map), it.photo ? "btn-primary" : "btn-line"));
          if (it.phone) add(btns, linkButton(T.placeCall, "tel:" + String(it.phone).replace(/[^0-9+]/g, ""), "btn-line"));
        }
      });
      return wrap;
    },

    icons: function (b) {
      var wrap = el("div");
      if (b.heading) add(wrap, el("h3", "icons-head", b.heading));
      var grid = add(wrap, el("div", "icons"));
      (b.items || []).forEach(function (it) {
        var t = add(grid, el("div", "tile"));
        addIcon(t, it.icon || "check", "ico-bubble");
        var body = add(t, el("div"));
        add(body, el("div", "tile-title", it.title));
        if (it.text) add(body, el("div", "tile-text", it.text));
      });
      return wrap;
    },

    text: function (b) {
      return el("p", "sec-text", b.text);
    },

    rows: function (b) {
      var c = card(b.heading, b.fold);
      (b.rows || []).forEach(function (r) {
        var row = add(c, el("div", "row"));
        add(row, el("div", "row-label", r[0]));
        if (r[1]) add(row, el("div", "row-value", r[1]));
      });
      return c;
    },

    steps: function (b) {
      var c = card(b.heading, b.fold);
      var ol = add(c, el("ol", "steps"));
      var n = typeof b.start === "number" ? b.start : 1;
      (b.items || []).forEach(function (s, i) {
        var li = add(ol, el("li", "step"));
        add(li, el("span", "step-num", pad2(n + i)));
        var body = add(li, el("div"));
        add(body, el("div", "step-title", s.title));
        if (s.text) add(body, el("div", "step-text", s.text));
      });
      return c;
    },

    note: function (b) {
      var box = el("div", "note");
      addIcon(box, b.icon || "info", "ico-bubble");
      var body = add(box, el("div", "note-body"));
      if (b.title) add(body, el("div", "note-title", b.title));
      if (b.text) add(body, el("p", "note-text", b.text));
      return box;
    },

    gallery: function (b) {
      var g = el("div", "gallery");
      g.style.gridTemplateColumns = "repeat(" + (b.cols || 2) + ", 1fr)";
      (b.items || []).forEach(function (it) {
        if (!it.src) return;
        var fig = add(g, el("figure", "gallery-item" + (b.fit === "contain" ? " contain" : "")));
        var img = el("img");
        img.alt = it.caption || "";
        img.loading = "lazy";
        img.onerror = function () { if (fig.parentNode) fig.parentNode.removeChild(fig); };
        img.src = it.src;
        add(fig, img);
        if (it.caption) add(fig, el("figcaption", "", it.caption));
      });
      return g;
    },

    image: function (b) {
      if (!b.src) return null;
      var fig = el("figure", "figure" + (b.small ? " small" : ""));
      var img = el("img");
      img.alt = b.caption || "";
      img.loading = "lazy";
      img.onerror = function () { if (fig.parentNode) fig.parentNode.removeChild(fig); };
      img.src = b.src;
      add(fig, img);
      if (b.caption) add(fig, el("figcaption", "", b.caption));
      return fig;
    },

    links: function (b) {
      var box = el("div", "link-list");
      (b.items || []).forEach(function (it) {
        if (!findScreen(it.to)) return;
        var a = add(box, el("a", "link-item"));
        a.href = "#" + it.to;
        addIcon(a, it.icon, "ico-bubble");
        add(a, el("span", "link-label", it.label));
        if (it.sub) add(a, el("span", "link-sub", it.sub));
      });
      return box;
    },

    calls: function (b) {
      var c = card(b.heading);
      (b.items || []).forEach(function (it) {
        var row = add(c, el("div", "call"));
        add(row, el("div", "call-title", it.number + "  " + it.label));
        if (it.note) add(row, el("div", "call-note", it.note));
        var label = (T.callButton || "{number}").replace("{number}", it.number);
        add(row, linkButton(label, "tel:" + String(it.number).replace(/[^0-9+]/g, ""), "btn-line"));
      });
      return c;
    },

    times: function () {
      var c = el("div", "card time-row");
      var t1 = add(c, el("div"));
      add(t1, el("div", "card-label", T.checkinTimeLabel));
      var v1 = add(t1, el("div", "time-value", C.checkinTime));
      if (T.checkinTimeSuffix) add(v1, el("span", "time-suffix", T.checkinTimeSuffix));
      var t2 = add(c, el("div"));
      add(t2, el("div", "card-label", T.checkoutTimeLabel));
      var v2 = add(t2, el("div", "time-value", C.checkoutTime));
      if (T.checkoutTimeSuffix) add(v2, el("span", "time-suffix", T.checkoutTimeSuffix));
      return c;
    },

    address: function () {
      var c = card(T.addressLabel);
      add(c, el("div", "card-value", C.address));
      if (C.addressNote) add(c, el("p", "card-text", C.addressNote));
      var stack = add(c, el("div", "btn-stack"));
      add(stack, copyButton(T.copyAddress, C.address, "btn-primary"));
      var maps = add(stack, el("div", "map-row"));
      (C.maps || []).forEach(function (m) {
        var url = mapUrl(m.type, C.mapAddress || C.address);
        if (url) add(maps, linkButton(m.label, url, "btn-line"));
      });
      return c;
    },

    wifi: function () {
      var box = el("div");
      var nameCard = add(box, card(T.wifiNameLabel));
      add(nameCard, el("div", "card-value", C.wifiName));
      var pwCard = add(box, card(T.wifiPasswordLabel));
      add(pwCard, el("div", "card-value", C.wifiPassword));
      var stack = add(pwCard, el("div", "btn-stack"));
      add(stack, copyButton(T.copyPassword, C.wifiPassword, "btn-primary"));
      if (C.wifiQrGuide) {
        var qrCard = add(box, card(T.wifiQrLabel));
        add(qrCard, el("p", "card-text", C.wifiQrGuide));
      }
      return box;
    },

    uber: function () {
      var hasPos = C.stayLatitude && C.stayLongitude;
      function place(key) {
        var p = [];
        if (hasPos) {
          p.push(key + "[latitude]=" + encodeURIComponent(C.stayLatitude));
          p.push(key + "[longitude]=" + encodeURIComponent(C.stayLongitude));
        }
        if (C.uberNickname) p.push(key + "[nickname]=" + encodeURIComponent(C.uberNickname));
        p.push(key + "[formatted_address]=" + encodeURIComponent(C.uberAddress || C.mapAddress || C.address));
        return p.join("&");
      }
      var base = "https://m.uber.com/ul/?action=setPickup&";
      var box = el("div");

      var c1 = add(box, card(T.uberToStayLabel));
      if (T.uberToStayNote) add(c1, el("p", "card-text", T.uberToStayNote));
      var s1 = add(c1, el("div", "btn-stack"));
      add(s1, linkButton(T.uberToStayButton, base + "pickup=my_location&" + place("dropoff"), "btn-primary"));

      var c2 = add(box, card(T.uberFromStayLabel));
      if (T.uberFromStayNote) add(c2, el("p", "card-text", T.uberFromStayNote));
      var s2 = add(c2, el("div", "btn-stack"));
      add(s2, linkButton(T.uberFromStayButton, base + place("pickup"), "btn-primary"));

      return box;
    },

    host: function () {
      var c = card(T.hostLabel);
      add(c, el("div", "card-value", C.hostName));
      if (C.contactGuide) add(c, el("p", "card-text", C.contactGuide));
      var stack = add(c, el("div", "btn-stack"));
      add(stack, linkButton(T.contactButton, C.contactUrl, "btn-primary"));
      if (T.contactNote) add(c, el("p", "card-note", T.contactNote));
      return c;
    }
  };

  /* ---------- 날짜와 시각 ---------- */
  var clockTimer = null;
  function startClock(parent) {
    var box = add(parent, el("p", "clock"));
    var d = add(box, el("span", "clock-date"));
    var t = add(box, el("span", "clock-time"));
    if (T.clockLabel) add(box, el("span", "clock-label", T.clockLabel));
    var tz = C.clockTimeZone || undefined;
    function tick() {
      var now = new Date();
      var mo, dd, wd, hh, mm;
      try {
        var parts = {};
        new Intl.DateTimeFormat("ko-KR", { timeZone: tz, month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
          .formatToParts(now).forEach(function (x) { parts[x.type] = x.value; });
        mo = parts.month; dd = parts.day; wd = parts.weekday; hh = parts.hour; mm = parts.minute;
      } catch (e) {
        mo = now.getMonth() + 1; dd = now.getDate(); wd = "일월화수목금토".charAt(now.getDay());
        hh = (now.getHours() < 10 ? "0" : "") + now.getHours(); mm = (now.getMinutes() < 10 ? "0" : "") + now.getMinutes();
      }
      d.textContent = mo + "." + dd + " (" + wd + ")";
      t.textContent = hh + ":" + mm;
    }
    tick();
    clockTimer = setInterval(tick, 15000);
  }

  /* ---------- 첫 화면 + 메뉴 ---------- */
  var currentTab = C.startTab || "after";

  function inGroup(s, g) {
    var v = s.group || "after";
    return Array.isArray(v) ? v.indexOf(g) !== -1 : v === g;
  }

  function renderHome() {
    var hero = add(app, el("header", "hero"));
    if (C.photo) {
      var img = el("img");
      img.alt = "";
      img.onerror = function () { app.classList.add("no-photo"); };
      img.src = C.photo;
      add(hero, img);
    } else {
      app.classList.add("no-photo");
    }
    var head = add(hero, el("div", "hero-text"));
    if (C.tagline) add(head, el("p", "tagline-top", C.tagline));
    add(head, el("h1", "stay-name", C.stayNameEn || C.stayName));
    if (C.clockShow) startClock(head);

    var sheet = add(app, el("main", "sheet"));

    /* 바로가기 세 개 */
    var quick = add(sheet, el("div", "quick"));
    function quickItem(tag, main, sub, ic) {
      var q = add(quick, el(tag, "quick-btn"));
      addIcon(q, ic);
      add(q, el("span", "quick-main", main));
      if (sub) add(q, el("span", "quick-sub", sub));
      return q;
    }
    var qw = quickItem("button", T.quickWifi, T.quickWifiSub, "wifi");
    qw.type = "button";
    qw.addEventListener("click", function () { copyText(String(C.wifiPassword)); });
    if (findScreen("taxi")) quickItem("a", T.quickTaxi, T.quickTaxiSub, "car").href = "#taxi";
    quickItem("a", T.quickContact, T.quickContactSub, "chat").href = C.contactUrl;

    /* 탭 */
    var groups = [["before", T.menuBefore], ["after", T.menuAfter], ["checkout", T.menuCheckout]].filter(function (g) {
      return SCREENS.some(function (s) { return s && s.id && inGroup(s, g[0]); });
    });
    if (!groups.some(function (g) { return g[0] === currentTab; }) && groups.length) currentTab = groups[0][0];

    var tabs = add(sheet, el("div", "tabs"));
    tabs.setAttribute("role", "tablist");
    tabs.style.gridTemplateColumns = "repeat(" + groups.length + ", 1fr)";
    var grid = add(sheet, el("nav", "menu"));

    function drawGrid() {
      grid.innerHTML = "";
      var n = 0;
      SCREENS.forEach(function (s) {
        if (!s || !s.id || !inGroup(s, currentTab)) return;
        var a = add(grid, el("a", "tile-menu" + (n === 0 && C.featureFirst !== false ? " feature" : "")));
        a.href = "#" + s.id;
        addIcon(a, s.icon, "ico-bubble");
        var txt = add(a, el("span"));
        add(txt, el("span", "menu-label", s.label));
        if (s.sub) add(txt, el("span", "menu-sub", s.sub));
        addIcon(a, "chevron", "go");
        n++;
      });
      Array.prototype.forEach.call(tabs.children, function (b) {
        b.setAttribute("aria-selected", b.getAttribute("data-g") === currentTab ? "true" : "false");
      });
    }
    groups.forEach(function (g) {
      var b = add(tabs, el("button", "tab", g[1]));
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("data-g", g[0]);
      b.addEventListener("click", function () { currentTab = g[0]; drawGrid(); });
    });
    drawGrid();

    if (T.homeFoot) add(sheet, el("p", "lattice-foot", T.homeFoot));
  }

  /* ---------- 상세 화면 ---------- */
  function renderScreen(s) {
    var bar = add(app, el("div", "topbar"));
    var top = add(bar, el("a", "btn btn-plain", T.back));
    top.href = "#home";

    var head = add(app, el("div", "screen-head"));
    addIcon(head, s.icon, "ico-bubble");
    var ht = add(head, el("div"));
    add(ht, el("h1", "screen-title", s.title || s.label));
    if (s.intro) add(ht, el("p", "screen-intro", s.intro));

    var body = add(app, el("div", "body"));
    (s.blocks || []).forEach(function (b) {
      if (!b || !blockMakers[b.type]) return;
      try {
        var node = blockMakers[b.type](b);
        if (node) add(body, node);
      } catch (e) {
        /* 조각 하나가 잘못되어도 나머지 화면은 그대로 보이게 합니다 */
      }
    });

    var bottom = add(body, el("a", "btn btn-line bottom-back", T.back));
    bottom.href = "#home";
  }

  /* ---------- 화면 전환 ---------- */
  function route() {
    var id = (location.hash || "").replace("#", "");
    var s = findScreen(id);
    app.innerHTML = "";
    app.classList.remove("no-photo");
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
    if (s) renderScreen(s); else renderHome();
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
