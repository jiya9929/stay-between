  .card-value { font-size: 21px; font-weight: 700; color: var(--frame); margin-bottom: 4px; }
  .card-text { font-size: 17px; white-space: pre-line; }
  .card-note { font-size: 16px; color: var(--muted); margin-top: 10px; }

  .map-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }

  }
  .time-row > div { padding: 0 18px; }
  .time-row > div + div { border-left: 1px solid rgba(255, 255, 255, 0.25); }
  .time-row .card-label { color: rgba(255, 255, 255, 0.8); font-weight: 600; }
  .time-value { font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
  .time-suffix { font-family: inherit; font-size: 16px; margin-left: 6px; opacity: 0.85; }

  .ico { display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .ico svg { width: 100%; height: 100%; display: block; }
  .ico-bubble { width: 46px; height: 46px; border-radius: 23px; background: var(--soft); color: var(--accent); padding: 10px; }
  .icons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .icons-head { font-size: 16px; font-weight: 700; color: var(--accent); margin: 4px 0 10px; }
  .tile {
    display: flex; flex-direction: column; gap: 8px;
    padding: 16px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #ffffff;
    box-shadow: var(--shadow);
  }
  .tile-title { font-size: 17px; font-weight: 800; color: var(--frame); line-height: 1.3; }
  .tile-text { font-size: 16px; color: var(--muted); line-height: 1.45; white-space: pre-line; }
  .icons > .tile:last-child:nth-child(odd) { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 14px; }

  /* 방 사진 카드 */
  .rooms { display: grid; gap: 14px; margin-bottom: 18px; }
  .rooms .icons-head { margin-bottom: 0; }

  .room-photo { flex: 0 0 100%; aspect-ratio: 4 / 3; scroll-snap-align: start; }
  .room-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .room-count { position: absolute; top: 10px; right: 10px; padding: 2px 10px; border-radius: 999px; background: rgba(30, 20, 14, 0.6); color: #ffffff; font-size: 13px; font-weight: 700; }
  .room-body { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }

  /* 장소 카드 */
  .places { display: grid; gap: 16px; margin-bottom: 14px; }
  .place {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(59, 42, 32, 0.08);

  .pager { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  .pdot { width: 7px; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.55); }
  .pdot.on { width: 18px; background: #ffffff; }
  .walk-badge {
    position: absolute; left: 12px; bottom: 12px;
    padding: 4px 12px; border-radius: 999px;
    background: var(--frame); color: #FFF8EE;
    font-size: 16px; font-weight: 700;
  }
  .place-body { padding: 16px; }
  .place-top { display: flex; align-items: center; gap: 12px; }
  .place-name-wrap { flex: 1; min-width: 0; }
  .place-name { font-size: 20px; font-weight: 800; color: var(--frame); line-height: 1.3; letter-spacing: -0.01em; }
  .place-en { font-size: 16px; color: var(--brass); font-weight: 700; letter-spacing: 0.04em; line-height: 1.3; }
  .walk-chip { flex: none; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); font-size: 16px; font-weight: 700; }
  .place-tags { font-size: 16px; color: var(--accent); font-weight: 600; margin-top: 8px; }
  .place-text { font-size: 17px; margin-top: 6px; }
  .place-meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 12px; padding: 12px 14px; background: var(--ivory); border-radius: 12px; }
  .place-meta dt { font-size: 16px; font-weight: 700; color: var(--accent); }
  .place-meta dd { font-size: 16px; }
  .place-btns { display: grid; gap: 8px; margin-top: 14px; }

  .place-mini .place-name { font-size: 18px; }

  .sec-body { flex: 1; min-width: 0; padding-top: 4px; }
  .sec-title { font-size: 21px; font-weight: 800; line-height: 1.35; color: var(--frame); }
  .sec-sub { font-size: 16px; color: var(--accent); margin-top: 2px; }
  .sec-text { font-size: 17px; margin-top: 6px; white-space: pre-line; }

  /* 항목 목록 */
  .row { display: grid; grid-template-columns: 6em 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }

  .steps { list-style: none; }

  .note {

  .gallery-item figcaption { font-size: 16px; color: var(--muted); margin-top: 6px; line-height: 1.35; }

  /* 다른 화면으로 가는 목록 */
  .link-list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #ffffff; box-shadow: var(--shadow); margin-bottom: 14px; }
  .link-item {
    display: flex; align-items: center; gap: 14px;
    min-height: 64px;
    padding: 12px 16px;
    color: var(--text);
    text-decoration: none;
  }
  .link-item + .link-item { border-top: 1px solid var(--line); }
  .link-item:active { background: var(--soft); }
  .link-label { flex: 1; font-size: 18px; font-weight: 700; color: var(--frame); }
  .link-sub { font-size: 16px; color: var(--accent); white-space: nowrap; }

  /* 전화 */
  .call { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .card-label + .call { border-top: none; padding-top: 4px; }
  .call:last-child { padding-bottom: 0; }
  .call-title { font-size: 18px; font-weight: 700; }
  .call-note { font-size: 16px; color: var(--muted); grid-column: 1; }
  .call .btn { grid-column: 2; grid-row: 1 / span 2; width: auto; min-width: 96px; }

  /* 버튼 */
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%;
    min-height: 52px;
    padding: 12px 16px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.4;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary { background: var(--accent); color: #ffffff; border: 1px solid var(--accent); }
  .btn-line { background: #ffffff; color: var(--accent); border: 1px solid var(--accent); }
  .btn-plain { display: inline-flex; width: auto; min-height: 48px; padding: 10px 0; background: none; border: none; color: var(--accent); }
  .btn:active { opacity: 0.85; }
  .bottom-back { margin-top: 28px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 화면이 바뀔 때 살짝 떠오르기 */
  @media (prefers-reduced-motion: no-preference) {
    .sheet, .body { animation: rise 0.35s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }

  /* 복사 알림 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(86px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    max-width: calc(100% - 32px);
    padding: 12px 18px;
    border-radius: 8px;
    background: var(--frame);
    color: #ffffff;
    font-size: 16px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

  function copyText(text) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      showToast(ok ? T.copied : T.copyFailed);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { showToast(T.copied); }, fallback);
    } else {
      fallback();
    }
  }

      }
      return box;
    },

    uber: function () {
      var hasPos = C.stayLatitude && C.stayLongitude;
      var addr = C.uberAddress || C.mapAddress || C.address;
      function place(key) {
        var p = [];
        if (hasPos) {
          p.push(key + "%5Blatitude%5D=" + encodeURIComponent(C.stayLatitude));
          p.push(key + "%5Blongitude%5D=" + encodeURIComponent(C.stayLongitude));
        }
        if (C.uberNickname) p.push(key + "%5Bnickname%5D=" + encodeURIComponent(C.uberNickname));
        p.push(key + "%5Bformatted_address%5D=" + encodeURIComponent(addr));
        return p.join("&");
      }
      var base = "https://m.uber.com/ul/?" + (C.uberClientId ? "client_id=" + encodeURIComponent(C.uberClientId) + "&" : "") + "action=setPickup&";

      /* 누르면 주소를 먼저 복사하고 우버를 엽니다 */
      function uberButton(label, url) {
        var a = linkButton(label, url, "btn-primary");
        a.addEventListener("click", function (ev) {
          ev.preventDefault();
          var ok = false;
          try {
            var ta = document.createElement("textarea");
            ta.value = addr; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
            document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, addr.length);
            ok = document.execCommand("copy");
            document.body.removeChild(ta);
          } catch (e) {}
          if (!ok && navigator.clipboard && window.isSecureContext) { try { navigator.clipboard.writeText(addr); } catch (e) {} }
          showToast(T.uberCopied);
          setTimeout(function () { window.location.href = url; }, 600);
        });
        return a;
      }

      var box = el("div");

      var c1 = add(box, card(T.uberToStayLabel));
      if (T.uberToStayNote) add(c1, el("p", "card-text", T.uberToStayNote));
      var s1 = add(c1, el("div", "btn-stack"));
      add(s1, uberButton(T.uberToStayButton, base + "pickup=my_location&" + place("dropoff")));

      var c2 = add(box, card(T.uberFromStayLabel));
      if (T.uberFromStayNote) add(c2, el("p", "card-text", T.uberFromStayNote));
      var s2 = add(c2, el("div", "btn-stack"));
      add(s2, uberButton(T.uberFromStayButton, base + place("pickup")));

      add(box, blockMakers.steps({ heading: T.uberHelpTitle, fold: true, items: [
        { title: "우버에서 \"어디로 가시나요?\" 칸 누르기" },
        { title: "칸을 길게 눌러 붙여넣기", text: "서울 중구 퇴계로52길 23" },
        { title: "검색 결과에서 숙소 주소 고르기" }
      ]}));

      return box;
    },

    host: function () {
      var c = card(T.hostLabel);
      add(c, el("div", "card-value", C.hostName));
      if (C.contactGuide) add(c, el("p", "card-text", C.contactGuide));
      var stack = add(c, el("div", "btn-stack"));
      add(stack, linkButton(T.contactButton, C.contactUrl, "btn-primary"));
      if (T.contactNote) add(c, el("p", "card-note", T.contactNote));
      return c;
    }
  };

  /* ---------- 날짜와 시각 ---------- */
  var clockTimer = null;
  var weatherCache = null;
  var WEATHER = {
    clear: { icon: "sun", ko: "맑음" }, partly: { icon: "cloudsun", ko: "구름 조금" }, cloudy: { icon: "cloud", ko: "흐림" },
    fog: { icon: "cloud", ko: "안개" }, rain: { icon: "rain", ko: "비" }, snow: { icon: "snow", ko: "눈" }, storm: { icon: "bolt", ko: "뇌우" }
  };
  function weatherKind(code) {
    if (code === 0) return "clear";
    if (code <= 2) return "partly";
    if (code === 3) return "cloudy";
    if (code === 45 || code === 48) return "fog";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
    if (code >= 95) return "storm";
    return "rain";
  }
  function showWeather(box) {
    if (!C.weatherShow || !C.stayLatitude || !C.stayLongitude || !window.fetch) return;
    function paint(w) {
      if (!w || !box.isConnected) return;
      var k = WEATHER[weatherKind(w.code)];
      var wrap = add(box, el("span", "clock-weather"));
      addIcon(wrap, k.icon);
      add(wrap, el("span", "", tr(k.ko) + " " + Math.round(w.temp) + "℃"));
    }
    if (weatherCache && Date.now() - weatherCache.at < 20 * 60 * 1000) { paint(weatherCache); return; }
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(C.stayLatitude) +
      "&longitude=" + encodeURIComponent(C.stayLongitude) + "&current=temperature_2m,weather_code&timezone=Asia%2FSeoul";
    try {
      fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
        if (!j || !j.current) return;
        weatherCache = { at: Date.now(), code: j.current.weather_code, temp: j.current.temperature_2m };
        paint(weatherCache);
      }).catch(function () {});
    } catch (e) {}
  }

  function startClock(parent) {
    var box = add(parent, el("p", "clock"));
    var d = add(box, el("span", "clock-date"));
    var t = add(box, el("span", "clock-time"));
    if (T.clockLabel) add(box, el("span", "clock-label", T.clockLabel));
    if (!C.clockShow) { d.style.display = "none"; t.style.display = "none"; }
    showWeather(box);
    var tz = C.clockTimeZone || undefined;
    function tick() {
      var now = new Date();
      var mo, dd, wd, hh, mm;
      try {
        var parts = {};
        new Intl.DateTimeFormat(LANG === "zh" ? "zh-CN" : LANG === "en" ? "en-US" : "ko-KR", { timeZone: tz, month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
          .formatToParts(now).forEach(function (x) { parts[x.type] = x.value; });
        mo = parts.month; dd = parts.day; wd = parts.weekday; hh = parts.hour; mm = parts.minute;
      } catch (e) {
        mo = now.getMonth() + 1; dd = now.getDate(); wd = "일월화수목금토".charAt(now.getDay());
        hh = (now.getHours() < 10 ? "0" : "") + now.getHours(); mm = (now.getMinutes() < 10 ? "0" : "") + now.getMinutes();
      }
      d.textContent = LANG === "en" ? wd + ", " + mo + "/" + dd : mo + "." + dd + " (" + wd + ")";
      t.textContent = hh + ":" + mm;
    }
    tick();
    clockTimer = setInterval(tick, 15000);
  }

  /* ---------- 첫 화면 + 메뉴 ---------- */
  var currentTab = C.startTab || "after";

  function inGroup(s, g) {
    var v = s.group || "after";
    return Array.isArray(v) ? v.indexOf(g) !== -1 : v === g;
  }

  function renderHome() {
    var hero = add(app, el("header", "hero"));
    if (C.photo) {
      var img = el("img");
      img.alt = "";
      img.onerror = function () { app.classList.add("no-photo"); };
      img.src = C.photo;
      add(hero, img);
    } else {
      app.classList.add("no-photo");
    }
    if ((C.languages || []).length > 1) add(hero, langSwitch("lang-hero"));
    var head = add(hero, el("div", "hero-text"));
    if (C.tagline) add(head, el("p", "tagline-top", C.tagline));
    add(head, el("h1", "stay-name", C.stayNameEn || C.stayName));


    var sheet = add(app, el("main", "sheet"));

    /* 바로가기 세 개 */
    if (C.clockShow || C.weatherShow) startClock(sheet);
    var quick = add(sheet, el("div", "quick"));
    function quickItem(tag, main, sub, ic) {
      var q = add(quick, el(tag, "quick-btn"));
      addIcon(q, ic);
      add(q, el("span", "quick-main", main));
      if (sub) add(q, el("span", "quick-sub", sub));
      return q;
    }
    var qw = quickItem("button", T.quickWifi, T.quickWifiSub, "wifi");
    qw.type = "button";
    qw.addEventListener("click", function () { copyText(String(C.wifiPassword)); });
    if (findScreen("taxi")) quickItem("a", T.quickTaxi, T.quickTaxiSub, "car").href = "#taxi";
    quickItem("a", T.quickContact, T.quickContactSub, "chat").href = C.contactUrl;

    /* 우리 동네 */
    var NB = C.neighborhood || {};
    var nb = null;
    if (NB.show !== false && (NB.cards || []).length) {
      nb = el("section", "nb");
      var nbHead = add(nb, el("div", "nb-head"));
      add(nbHead, el("h2", "nb-title", NB.title));
      if (NB.sub) add(nbHead, el("p", "nb-sub", NB.sub));

      var cards = add(nb, el("div", "nb-cards"));
      NB.cards.forEach(function (cd) {
        if (!findScreen(cd.to)) return;
        var a = add(cards, el("a", "nb-card"));
        a.href = "#" + cd.to;
        if (cd.photo) {
          var pw = add(a, el("span", "nb-photo"));
          var im = el("img");
          im.alt = "";
          im.onerror = function () { if (pw.parentNode) pw.parentNode.removeChild(pw); };
          im.src = cd.photo;
          add(pw, im);
        }
        var cap = add(a, el("span", "nb-cap"));
        var tt = add(cap, el("span", "nb-card-title", cd.title));
        addIcon(tt, "chevron");
        if (cd.sub) add(cap, el("span", "nb-card-sub", cd.sub));
      });

      /* 사진 줄: 맛집과 둘러볼 곳의 사진 있는 장소 */
      var spots = [];
      NB.cards.forEach(function (cd) {
        var sc = findScreen(cd.to);
        if (!sc) return;
        var k = 0;
        (sc.blocks || []).forEach(function (b) {
          if (b.type !== "places") return;
          (b.items || []).forEach(function (it) {
            if (it.photo) spots.push({ to: cd.to, idx: k, it: it });
            k++;
          });
        });
      });
      if (spots.length) {
        var sh = add(nb, el("div", "strip-head"));
        add(sh, el("h3", "strip-title", NB.stripTitle));
        if (NB.stripHint) add(sh, el("span", "strip-hint", NB.stripHint));
        var strip = add(nb, el("div", "strip"));
        spots.forEach(function (sp) {
          var a = add(strip, el("a", "spot"));
          a.href = "#" + sp.to + ":" + sp.idx;
          var ph = add(a, el("span", "spot-photo"));
          var im = el("img");
          im.alt = "";
          im.loading = "lazy";
          im.src = sp.it.photo;
          add(ph, im);
          if (sp.it.walk) add(ph, el("span", "spot-walk", walkText(sp.it.walk)));
          add(a, el("span", "spot-name", sp.it.name));
          if (sp.it.tags) add(a, el("span", "spot-tags", sp.it.tags));
        });
      }
    }

    /* 탭 */
    var groups = [["before", T.menuBefore], ["after", T.menuAfter], ["checkout", T.menuCheckout]].filter(function (g) {
      return SCREENS.some(function (s) { return s && s.id && inGroup(s, g[0]); });
    });
    if (!groups.some(function (g) { return g[0] === currentTab; }) && groups.length) currentTab = groups[0][0];

    var tabs = add(sheet, el("div", "tabs"));
    tabs.setAttribute("role", "tablist");
    tabs.style.gridTemplateColumns = "repeat(" + groups.length + ", 1fr)";
    var grid = add(sheet, el("nav", "menu"));

    function drawGrid() {
      grid.innerHTML = "";
      var n = 0;
      SCREENS.forEach(function (s) {
        if (!s || !s.id || !inGroup(s, currentTab)) return;
        var a = add(grid, el("a", "tile-menu" + (n === 0 && C.featureFirst !== false ? " feature" : "")));
        a.href = "#" + s.id;
        addIcon(a, s.icon, "ico-bubble");
        var txt = add(a, el("span"));
        add(txt, el("span", "menu-label", s.label));
        if (s.sub) add(txt, el("span", "menu-sub", s.sub));
        addIcon(a, "chevron", "go");
        n++;
      });
      var plain = grid.querySelectorAll(".tile-menu:not(.feature)");
      if (plain.length % 2 === 1) plain[plain.length - 1].classList.add("wide");
      if (nb && currentTab === (NB.tab || "after")) grid.appendChild(nb);
      Array.prototype.forEach.call(tabs.children, function (b) {
        b.setAttribute("aria-selected", b.getAttribute("data-g") === currentTab ? "true" : "false");
      });
    }
    groups.forEach(function (g) {
      var b = add(tabs, el("button", "tab", g[1]));
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("data-g", g[0]);
      b.addEventListener("click", function () { currentTab = g[0]; drawGrid(); });
    });
    drawGrid();

    if (T.homeFoot) add(sheet, el("p", "lattice-foot", T.homeFoot));
  }

  /* ---------- 상세 화면 ---------- */
  var placeCounter = 0;
  function renderScreen(s) {
    placeCounter = 0;
    var bar = add(app, el("div", "topbar"));
    var top = add(bar, el("a", "btn btn-plain", T.back));
    top.href = "#home";
    if ((C.languages || []).length > 1) add(bar, langSwitch("lang-bar"));

    var head = add(app, el("div", "screen-head"));
    addIcon(head, s.icon, "ico-bubble");
    var ht = add(head, el("div"));
    add(ht, el("h1", "screen-title", s.title || s.label));
    if (s.intro) add(ht, el("p", "screen-intro", s.intro));

    var body = add(app, el("div", "body"));
    (s.blocks || []).forEach(function (b) {
      if (!b || !blockMakers[b.type]) return;
      try {
        var node = blockMakers[b.type](b);
        if (node) add(body, node);
      } catch (e) {
        /* 조각 하나가 잘못되어도 나머지 화면은 그대로 보이게 합니다 */
      }
    });

    var bottom = add(body, el("a", "btn btn-line bottom-back", T.back));
    bottom.href = "#home";
  }

  /* ---------- 맨 아래 메뉴 줄 ---------- */
  function drawTabbar(current) {
    var bar = document.getElementById("tabbar");
    bar.innerHTML = "";
    var items = (C.bottomNav || []).filter(function (n) { return n.to === "home" || findScreen(n.to); });
    if (!items.length) return;
    var inner = add(bar, el("div", "tabbar-in"));
    items.forEach(function (n) {
      var a = add(inner, el("a", "tb"));
      a.href = "#" + n.to;
      if (n.to === current) a.setAttribute("aria-current", "page");
      addIcon(a, n.icon);
      add(a, el("span", "tb-label", n.label));
    });
  }

  /* ---------- 화면 전환 ---------- */
  function route(keepScroll) {
    var y0 = window.pageYOffset;
    var parts = (location.hash || "").replace("#", "").split(":");
    var s = findScreen(parts[0]);
    app.innerHTML = "";
    app.classList.remove("no-photo");
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
    if (s) renderScreen(s); else renderHome();
    drawTabbar(s ? s.id : "home");
    window.scrollTo(0, keepScroll === true ? y0 : 0);
    if (keepScroll !== true && s && parts[1]) {
      var target = app.querySelector('[data-place="' + parts[1] + '"]');
      if (target) {
        setTimeout(function () {
          var y = target.getBoundingClientRect().top + window.pageYOffset - 68;
          window.scrollTo(0, y);
          target.classList.add("flash");
        }, 60);
      }
    }
  }

  window.addEventListener("hashchange", function () { route(); });
  document.documentElement.lang = LANG === "zh" ? "zh-Hans" : LANG;
  route();
})();
</script>
</body>
</html>
